name: "Test Devcontainer Features"
on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Check out the repository source tree
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Install Node.js to enable the devcontainers tooling
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # Step 3: Install the official Devcontainers CLI layer
      - name: Install Devcontainers CLI
        run: npm install -g @devcontainers/cli

      # Step 4: Run the specific test suites you configured
      # Using explicit targeting avoids default global directory scanning loops
      - name: Run Feature Scenario Tests
        run: |
          devcontainer features test \
            --features agones-sdk-server \
            --base-path .
